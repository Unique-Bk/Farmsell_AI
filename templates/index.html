<!DOCTYPE html>
<html>

<head>
    <title>FarmSell AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='style.css') }}">
</head>

<body>

<header>
    <h1>🌾 FarmSell AI</h1>
    <p>Smart Selling Decisions for Farmers</p>
</header>


<div class="container">

    <div class="card">

        <h2>Enter Farm Details</h2>

        <label>Crop</label>

        <select id="crop">

            <option value="Wheat">
                Wheat
            </option>

            <option value="Rice">
                Rice
            </option>

            <option value="Potato">
                Potato
            </option>

        </select>


        <label>Month</label>

        <input
            type="number"
            id="month"
            min="1"
            max="12"
            value="3"
        >


        <label>Market</label>

        <select id="market">

            <option value="Meerut">
                Meerut
            </option>

            <option value="Muzaffarnagar">
                Muzaffarnagar
            </option>

            <option value="Delhi">
                Delhi
            </option>

        </select>


        <label>Quantity (quintals)</label>

        <input
            type="number"
            id="quantity"
            value="20"
        >


        <label>Temperature (°C)</label>

        <input
            type="number"
            id="temperature"
            value="25"
        >


        <label>Rainfall (mm)</label>

        <input
            type="number"
            id="rainfall"
            value="50"
        >


        <button onclick="predictPrice()">
            🤖 Analyze Market
        </button>

    </div>


    <div class="card result">

        <h2>AI Result</h2>

        <div id="result">
            Enter your farm details
            and click Analyze Market.
        </div>

    </div>

</div>


<script src="{{ url_for('static',
filename='script.js') }}"></script>

</body>

</html>
